<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19202b">
  <meta name="description" content="Десктопный канал Alarisa">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <title>Alarisa Desk</title>
</head>
<body>
  <main>
    <p class="eyebrow">Десктопный канал</p>
    <h1>Alarisa Desk</h1>
    <section id="auth-panel">
      <p id="auth-status" aria-live="polite">Проверяем доступ…</p>
      <button id="auth-action" type="button" hidden>Войти с passkey</button>
    </section>
    <section id="workspace" hidden>
    <p>Principal подтверждён. Рабочее пространство будет добавлено после определения его продуктовой модели.</p>
    <button id="lock-action" type="button" class="secondary">Заблокировать Alarisa</button>
    </section>
    <a href="/">Выбрать другой канал</a>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
