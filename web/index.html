<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7efe6">
  <meta name="description" content="Alarisa desktop World Picture viewer">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <title>Alarisa Desk</title>
</head>
<body>
  <main>
    <p class="eyebrow">Desktop channel</p>
    <h1>Alarisa Desk</h1>
    <section id="auth-panel" aria-labelledby="auth-status">
      <p id="auth-status" aria-live="polite">Checking access…</p>
      <button id="auth-action" type="button" hidden>Sign in with a passkey</button>
    </section>
    <section id="workspace" hidden aria-label="World Picture workspace">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">World Picture · Hierarchy</p>
          <p id="workspace-status" aria-live="polite">Loading the World Picture…</p>
        </div>
        <div class="workspace-actions">
          <nav id="world-breadcrumb" aria-label="World Picture path"></nav>
          <button id="lock-action" type="button" class="secondary">Lock Alarisa</button>
        </div>
      </header>
      <p id="workspace-error" role="alert" hidden></p>
      <button id="retry-action" type="button" hidden>Retry</button>
      <div class="workspace-grid">
        <section class="tree-panel" aria-label="World Picture tree">
          <div class="panel-heading">
            <div><h2>Hierarchy</h2><span class="hint">Select to inspect · ↗ to explore</span></div>
            <div class="tree-actions"><button id="expand-level-action" type="button" class="text-button">Expand level</button><button id="collapse-all-action" type="button" class="text-button">Collapse all</button></div>
          </div>
          <world-picture-tree id="world-tree"></world-picture-tree>
        </section>
        <aside class="detail-panel" aria-live="polite">
          <world-picture-detail id="world-detail"></world-picture-detail>
        </aside>
      </div>
    </section>
    <a href="/">Choose another channel</a>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
