<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19202b">
  <meta name="description" content="Alarisa desktop channel">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <title>Alarisa Desk</title>
</head>
<body>
  <main>
    <p class="eyebrow">Desktop channel</p>
    <h1>Alarisa Desk</h1>
    <section id="auth-panel">
      <p id="auth-status" aria-live="polite">Checking access…</p>
      <button id="auth-action" type="button" hidden>Sign in with a passkey</button>
    </section>
    <section id="workspace" hidden>
    <p>Principal verified. The workspace will be added after its product model is defined.</p>
    <button id="lock-action" type="button" class="secondary">Lock Alarisa</button>
    </section>
    <a href="/">Choose another channel</a>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
